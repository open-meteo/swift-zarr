name: Lint & Test
on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - swift: "6.1.3"
            os: macos-15
          - swift: "6.2.4"
            os: macos-26
          - swift: "6.1.3"
            os: ubuntu-latest
          - swift: "6.2.4"
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (Swift ${{ matrix.swift }})
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      # Remove this workaround and use swiftly-action on macOS once
      # https://github.com/vapor/swiftly-action/pull/8 is resolved and released.
      - name: Setup Swift (macOS)
        if: runner.os == 'macOS'
        env:
          REQUESTED_TOOLCHAIN: ${{ matrix.swift }}
        run: |
          brew install swiftly
          swiftly init --assume-yes --no-modify-profile --skip-install --quiet-shell-followup
          source "${SWIFTLY_HOME_DIR:-$HOME/.swiftly}/env.sh"
          swiftly install --assume-yes --use "$REQUESTED_TOOLCHAIN"
          echo "SWIFTLY_HOME_DIR=$SWIFTLY_HOME_DIR" >> "$GITHUB_ENV"
          echo "SWIFTLY_BIN_DIR=$SWIFTLY_BIN_DIR" >> "$GITHUB_ENV"
          echo "$SWIFTLY_BIN_DIR" >> "$GITHUB_PATH"

      - name: Setup Swift (Linux)
        if: runner.os == 'Linux'
        uses: vapor/swiftly-action@v0.2
        with:
          toolchain: ${{ matrix.swift }}

      - name: Cache resolved dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            .build
            Package.resolved
          key: ${{ runner.os }}-swift-${{ matrix.swift }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-${{ matrix.swift }}-spm-

      - name: Resolve dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: swift package resolve

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test

  lint:
    runs-on: ubuntu-latest
    name: Lint (Swift 6)
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: vapor/swiftly-action@v0.2
        with:
          toolchain: "6.2.4"

      - name: Run swift-format lint
        run: swift-format lint --strict --recursive .

      - name: Cache resolved dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            .build
            Package.resolved
          key: ubuntu-latest-swift-6.2.4-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ubuntu-latest-swift-6.2.4-spm-

      - name: Resolve dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: swift package resolve

      - name: Build with strict concurrency
        run: >
          swift build
          -Xswiftc -strict-concurrency=complete
          -Xswiftc -warnings-as-errors
